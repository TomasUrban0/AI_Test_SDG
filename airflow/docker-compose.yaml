# =============================================================================
# Docker Compose — Apache Airflow para el pipeline de Churn
# =============================================================================
#
# Basado en la configuración oficial de Airflow:
# https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html
#
# Simplificado para la prueba técnica: usa LocalExecutor (sin Celery/Redis)
# para reducir la complejidad y el consumo de recursos.
#
# Uso:
#   docker-compose up airflow-init   (solo la primera vez)
#   docker-compose up -d             (levanta todo en background)
#   docker-compose down              (para todo)
#
# Acceso: http://localhost:8080  (user: airflow / pass: airflow)
# =============================================================================

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Rutas internas del contenedor
    CHURN_DATA_DIR: /opt/airflow/data
    CHURN_SCRIPTS_DIR: /opt/airflow/scripts
    CHURN_MODELS_DIR: /opt/airflow/models
    # Extensión 3.6: PostgreSQL para persistencia de datos del pipeline
    CHURN_DB_HOST: postgres
    CHURN_DB_PORT: '5432'
    CHURN_DB_NAME: churn_db
    CHURN_DB_USER: airflow
    CHURN_DB_PASSWORD: airflow
    # Extensión 3.6 — Fase 2: MLflow tracking
    MLFLOW_TRACKING_URI: http://mlflow-server:5000
    # Extensión 3.6 — Fase 3: Prometheus Pushgateway
    PUSHGATEWAY_URL: http://pushgateway:9091
    _PIP_ADDITIONAL_REQUIREMENTS: ''
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ../scripts:/opt/airflow/scripts          # Los 3 scripts modulares
    - ../data:/opt/airflow/data                # dataset.csv + processed/
    - ../models:/opt/airflow/models            # churn_model.pkl output
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  # =========================================================================
  # PostgreSQL — base de datos del metadata de Airflow
  # =========================================================================
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      # Extensión 3.6: permite crear múltiples DBs
      POSTGRES_MULTIPLE_DATABASES: churn_db,mlflow_db
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d    # Script de init para churn_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # =========================================================================
  # MLflow Tracking Server — experiment tracking (http://localhost:5000)
  # =========================================================================
  mlflow-server:
    image: python:3.10-slim
    command: bash -c "pip install --no-cache-dir mlflow==2.12.2 psycopg2-binary && mlflow server --backend-store-uri postgresql+psycopg2://airflow:airflow@postgres:5432/mlflow_db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ../models:/mlflow/artifacts    # Artefactos compartidos con el pipeline
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # =========================================================================
  # Prometheus Pushgateway — recibe métricas del pipeline (http://localhost:9091)
  # =========================================================================
  pushgateway:
    image: prom/pushgateway:v1.6.2
    ports:
      - "9091:9091"
    restart: always

  # =========================================================================
  # Prometheus — almacena y consulta métricas (http://localhost:9090)
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.48.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - pushgateway
    restart: always

  # =========================================================================
  # Grafana — dashboards de monitorización (http://localhost:3000)
  # =========================================================================
  grafana:
    image: grafana/grafana:10.2.3
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: always

  # =========================================================================
  # Airflow Webserver — interfaz web (http://localhost:8080)
  # =========================================================================
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # =========================================================================
  # Airflow Scheduler — ejecuta los DAGs según su schedule
  # =========================================================================
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # =========================================================================
  # Airflow Triggerer — para deferrable operators (opcional pero recomendado)
  # =========================================================================
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # =========================================================================
  # Airflow Init — inicializa la DB y crea el usuario admin (solo primera vez)
  # =========================================================================
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    volumes:
      - .:/sources

  # =========================================================================
  # Airflow CLI — utilidad para ejecutar comandos de Airflow
  # =========================================================================
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

volumes:
  postgres-db-volume:
